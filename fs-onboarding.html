<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIREstarter | Onboarding</title>
    <link rel="stylesheet" href="fs-onboarding.css">
</head>
<body>
    <header class="top-header">
        <div class="green-stripe"></div>
        <div class="logo-container">
            <img src="./icons/fs-logo.png" alt="FIREstarter Logo" class="header-logo">
            <span class="logo-text">FIRE<span>starter</span></span>
        </div>
    </header>

    <div class="main-content">
        <div class="onboarding-container">
            <div class="progress-container">
                <div id="progressBar"></div>
            </div>

            <form id="fireOnboardingForm">
                <div class="step active" id="step1">
                    <h2><span class="glitch">01</span> Profile</h2>
                    <input type="text" id="username" placeholder="Pick a unique username" required>
                    <input type="number" id="currentAge" placeholder="Current Age" min="1" max="120" required>
                    <input type="number" id="targetRetireAge" placeholder="Target Retirement Age" min="18" required>
                    <div class="button-group">
                        <button type="button" class="next-btn" onclick="next(2)">CONTINUE</button>
                    </div>
                </div>

                <div class="step" id="step2" style="display:none;">
                    <h2><span class="glitch">02</span> Capital</h2>
                    <input type="number" id="currentSavings" placeholder="Current Savings (₱)" min="0" required>
                    <div class="input-group">
                        <input type="number" id="annualExpenses" placeholder="Annual Expenses (₱)" min="0" oninput="updateMonthlyExpense()" required>
                        <p id="monthlyExpenseNote" class="input-tip success-text">₱0 per month</p>
                    </div>
                    <div class="button-group">
                        <button type="button" class="next-btn btn-secondary" onclick="next(1)">BACK</button>
                        <button type="button" class="next-btn" onclick="next(3)">ANALYZE</button>
                    </div>
                </div>

                <div class="step" id="step3" style="display:none;">
                    <h2><span class="glitch">03</span> Growth</h2>
                    <input type="number" id="savingsAmount" placeholder="Monthly Savings Amount (₱)" min="0" required>
                    <input type="number" id="returnRate" placeholder="Expected Return (%)" min="0" required>
                    <p class="input-tip">Philippine index funds typically return 8–10% annually.</p>
                    <div class="button-group">
                        <button type="button" class="next-btn btn-secondary" onclick="next(2)">BACK</button>
                        <button type="button" class="next-btn" onclick="next(4)">STRATEGIZE</button>
                    </div>
                </div>

                <div class="step" id="step4" style="display:none;">
                    <h2><span class="glitch">04</span> Select FIRE Protocol</h2>
                    <div class="fire-options">
                        <label class="fire-card">
                            <input type="radio" name="fireType" value="lean" onchange="updateFIREPreview()" checked>
                            <span><b>Lean FIRE</b> (Simple Provincial Living - 20x)</span>
                        </label>
                        <label class="fire-card">
                            <input type="radio" name="fireType" value="standard" onchange="updateFIREPreview()">
                            <span><b>Standard FIRE</b> (Comfortable Metro Manila - 25x)</span>
                        </label>
                        <label class="fire-card">
                            <input type="radio" name="fireType" value="fat" onchange="updateFIREPreview()">
                            <span><b>Fat FIRE</b> (High-end BGC/Makati Luxury - 30x)</span>
                        </label>
                    </div>
                    <div class="fire-number-preview">
                        Your FIRE Number: <span id="liveFIRENumber">₱0</span>
                    </div>
                    <div class="button-group">
                        <button type="button" class="next-btn btn-secondary" onclick="next(3)">BACK</button>
                        <button type="submit" class="finalize-btn">INITIALIZE FIREstarter</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <script src="fs-onboarding.js"></script>
</body>
</html>
