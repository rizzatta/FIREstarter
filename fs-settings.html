<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIREstarter | Settings</title>
    <link rel="stylesheet" href="fs-dashboard.css">
    <style>
        .back-btn { transition: all 0.2s ease-in-out; }
        .back-btn:hover { background: #555 !important; }
        .back-btn:active { background: #777 !important; transform: scale(0.98); }
        
        .photo-preview { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 2px solid #FF8C00; }
        .default-avatar { width: 70px; height: 70px; border-radius: 50%; background: #FF8C00; color: white; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 2rem; }
    </style>
</head>
<body>
    <header class="top-header">
        <div class="logo-container" style="cursor:pointer;" onclick="location.href='fs-dashboard.html'">
            <img src="./icons/fs-logo.png" alt="Logo" class="header-logo">
            <span class="logo-text">FIRE<span>starter</span></span>
        </div>
        <button onclick="location.href='fs-dashboard.html'" class="add-btn back-btn" style="background: var(--text-dark);">← Back to Dashboard</button>
    </header>

    <main class="dashboard-container" style="max-width: 800px;">
        <h1 class="welcome-text">Account <span>Settings</span></h1>
        
        <section class="wide-card">
            <div class="card-header-row"><h3>Profile Information</h3></div>
            
            <div class="calc-group" style="margin-top: 15px; border-bottom: 1px solid #eee; padding-bottom: 20px;">
                <label>Profile Photo</label>
                <div style="display:flex; align-items: center; gap:20px; margin-top: 10px;">
                    <img id="previewImg" src="" alt="Profile" class="photo-preview" style="display:none;">
                    <div id="defaultAvatar" class="default-avatar">F</div>
                    
                    <div>
                        <input type="file" id="photoInput" accept="image/*" style="display:none;" onchange="previewAndUploadPhoto(event)">
                        <button class="add-btn" onclick="document.getElementById('photoInput').click()" style="background: #28A745;">Upload New Photo</button>
                    </div>
                </div>
            </div>

            <div class="calc-group" style="margin-top: 20px;">
                <label>Change Display Name</label>
                <div style="display:flex; gap:10px;">
                    <input type="text" id="newUsername" placeholder="Enter new name...">
                    <button class="add-btn" onclick="updateUsername()">Save</button>
                </div>
            </div>
        </section>

        <section class="wide-card" style="border-top: 4px solid #dc3545;">
            <h3 style="color: #dc3545;">Account Deletion</h3>
            <p style="font-size: 0.9rem; margin-bottom: 15px;">Deleting your account is permanent. Please confirm your password to proceed.</p>
            
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <input type="password" id="deletePassword" placeholder="Enter your password..." style="max-width: 300px;">
            </div>

            <div style="display: flex; gap: 15px;">
                <button class="add-btn" style="background: #dc3545;" onclick="deleteAccount()">Delete Account</button>
            </div>
        </section>
    </main>

    <script>
        const userId = localStorage.getItem('activeUserId');
        
        function previewAndUploadPhoto(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                const base64Image = e.target.result;
                
                document.getElementById('defaultAvatar').style.display = 'none';
                document.getElementById('previewImg').style.display = 'block';
                document.getElementById('previewImg').src = base64Image;

                await fetch('http://localhost:5000/api/settings/photo', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, photoData: base64Image })
                });
                alert("Profile photo updated successfully!");
            };
            reader.readAsDataURL(file); 
        }

        async function updateUsername() {
            const newName = document.getElementById('newUsername').value;
            if (!newName) return;
            await fetch('http://localhost:5000/api/settings/username', {
                method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userId, newName })
            });
            alert("Name updated successfully!");
        }

        async function deleteAccount() {
            const password = document.getElementById('deletePassword').value;
            if(!password) return alert("You must enter your password to delete your account.");
            if(!confirm("Are you absolutely sure? This deletes ALL archives forever.")) return;
            
            const res = await fetch(`http://localhost:5000/api/settings/account/${userId}`, { 
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
            });
            
            const data = await res.json();

            if(res.ok) {
                alert("Account deleted. Goodbye.");
                localStorage.removeItem('activeUserId');
                window.location.href = "fs-login.html";
            } else {
                alert(data.error || "Deletion failed. Incorrect password?");
            }
        }
    </script>
</body>
</html>
